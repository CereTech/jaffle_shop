version: "3.9"
services:
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.15
    working_dir: /usr/app
    depends_on:
      - postgres
    volumes:
      - "..:/usr/app"
    entrypoint: /usr/app/docker/entrypoint.sh
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "7547:5432"
